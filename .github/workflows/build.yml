name: build-patched-apk

# 用固定基座 APK 重建 PuddingPods（只改 classes.dex 里的一个指令）。
# 基座与 sha256 一起钉死，保证可复现；上游更新后需要重新校验补丁并同步这两个值。

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_APK: base/PuddingPods-3.47-stock.apk
  BASE_SHA256: ebe7c11ab40e988bb24ae765f736e1fdd4f9b929e8cbf4efc64d57d83eeb4ae0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu runner 预装 Android SDK，直接用它的 build-tools。
      # （不用 android-actions/setup-android：它会去装已废弃的 "tools" 包而报错）
      - name: Locate Android build-tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools: $BT"
          ls "$BT" | head
          echo "ZIPALIGN=${BT}zipalign" >> "$GITHUB_ENV"
          echo "APKSIGNER=${BT}apksigner" >> "$GITHUB_ENV"

      - name: Verify pinned base APK
        run: |
          set -euo pipefail
          echo "${BASE_SHA256}  ${BASE_APK}" | sha256sum -c -

      - name: Fetch baksmali / smali
        run: |
          set -euo pipefail
          curl -fsSL -o baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar
          curl -fsSL -o smali.jar https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar

      - name: Build patched APK
        env:
          BASE_APK: ${{ github.workspace }}/base/PuddingPods-3.47-stock.apk
        run: bash tools/build.sh

      - name: Show result
        run: ls -l out && sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PuddingPods-3.47-batteryfix-debug
          path: out/*.apk
          if-no-files-found: error
